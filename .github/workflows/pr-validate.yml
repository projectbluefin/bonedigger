name: pr-validate

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Unit tests
        run: |
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q python3-yaml; }
          python3 -m unittest discover -s tests -v
      - name: pre-commit
        run: |
          python3 -m pip install --user -r .github/requirements-ci.txt
          "$HOME/.local/bin/pre-commit" run --all-files --show-diff-on-failure
